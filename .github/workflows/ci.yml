name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest --noconftest -p no:cacheprovider tests/test_fixture_safety.py
      - run: make test
      - name: Проверка защиты тестового образа
        run: uv run pytest -q scripts/test_test_entrypoint.py
      - run: make up
      - run: make smoke
      - run: make recovery
      - if: always()
        run: docker compose --profile test logs --tail=100
      - if: always()
        run: docker compose --profile test down -v
